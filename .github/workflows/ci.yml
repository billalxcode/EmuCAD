name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release

  release-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: python3 scripts/release.py --print-version
      - name: Checksums
        run: |
          mkdir -p /tmp/release-check
          echo test > /tmp/release-check/emucad-v0.1.0-test.tar.gz
          python3 scripts/release.py --checksums /tmp/release-check
          cd /tmp/release-check
          sha512sum -c SHA512SUMS

  ngspice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ngspice image
        run: docker build -f ci/ngspice.Dockerfile -t emucad-ngspice .
      - name: Golden RC
        run: docker run --rm -v "$PWD:/work" emucad-ngspice bash scripts/ngspice_golden.sh
