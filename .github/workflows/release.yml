name: release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Read version
        id: meta
        shell: bash
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          version="$(python3 scripts/release.py --print-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building EmuCAD v$version from $sha"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python: python3
          - os: macos-latest
            target: aarch64-apple-darwin
            python: python3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Build binaries
        run: cargo build --release -p cli -p gui
      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          COMMIT: ${{ needs.prepare.outputs.sha }}
        run: |
          ${{ matrix.python }} scripts/release.py \
            --version "$VERSION" \
            --target "$TARGET" \
            --commit "$COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/emucad-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: python3 scripts/release.py --checksums dist
      - name: Build release notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          source_run="${SOURCE_RUN:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}"
          {
            cat docs/53-release-notes.md
            echo
            echo "## Build"
            echo
            echo "- Version: ${VERSION}"
            echo "- Commit: ${SHA}"
            echo "- Source run: ${source_run}"
            echo "- Targets: linux-x86_64, macos-arm64, windows-x86_64"
          } > release-notes.md
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "EmuCAD ${tag}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$tag" \
              --title "EmuCAD ${tag}" \
              --notes-file release-notes.md \
              --target "$SHA" \
              --latest
          fi
          gh release upload "$tag" dist/* --clobber
