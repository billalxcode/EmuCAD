[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/device",
    "crates/analysis",
    "crates/cells",
    "crates/mixed",
    "crates/avr",
    "crates/soc",
    "crates/board",
    "crates/cli",
    "crates/gui",
    "crates/python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["EmuCAD contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
